<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350"
  viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Modelo de divulgação de vaga E&amp;D para feed</title>
  <desc id="desc">Template editável em proporção quatro por cinco, com cargo, dados da vaga, atividades, requisitos e contato.</desc>
