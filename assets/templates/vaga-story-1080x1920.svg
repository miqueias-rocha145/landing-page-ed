  <circle cx="1030" cy="20" r="270" fill="none" stroke="#70CDF5" stroke-opacity=".18" stroke-width="2" />
  <circle cx="1030" cy="20" r="180" fill="#0EA3E8" fill-opacity=".08" />

  <g id="marca">
