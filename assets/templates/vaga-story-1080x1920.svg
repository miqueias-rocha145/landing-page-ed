      <circle cx="108" cy="1423" r="7" fill="#0EA3E8" /><text x="142" y="1434">Segundo requisito em frase curta</text>
      <circle cx="108" cy="1493" r="7" fill="#0EA3E8" /><text x="142" y="1504">Terceiro requisito, quando necessário</text>
