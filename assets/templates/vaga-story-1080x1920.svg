<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920"
  viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Modelo de divulgação de vaga E&amp;D para stories</title>
  <desc id="desc">Template editável em proporção nove por dezesseis, com cargo, dados da vaga, atividades, requisitos e contato.</desc>
  <defs>
    <linearGradient id="header-gradient-story" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#031328" />
      <stop offset="1" stop-color="#0B3154" />
    </linearGradient>
    <linearGradient id="footer-gradient-story" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#087FBD" />
      <stop offset="1" stop-color="#0EA3E8" />
    </linearGradient>
    <style>
      .display { font-family: "Plus Jakarta Sans", "Segoe UI", Arial, sans-serif; }
      .body { font-family: "Geist", "Segoe UI", Arial, sans-serif; }
      .bullet { font-size: 32px; font-weight: 500; }
    </style>
  </defs>

  <rect width="1080" height="1920" fill="#F3F8FC" />
