    <g class="body bullet" fill="#40566C">
      <circle cx="108" cy="901" r="7" fill="#0EA3E8" /><text x="142" y="912">Primeira atividade principal da função</text>
      <circle cx="108" cy="971" r="7" fill="#0EA3E8" /><text x="142" y="982">Segunda atividade em frase curta e direta</text>
      <circle cx="108" cy="1041" r="7" fill="#0EA3E8" /><text x="142" y="1052">Terceira atividade, quando necessária</text>
      <circle cx="108" cy="1111" r="7" fill="#0EA3E8" /><text x="142" y="1122">Quarta atividade, quando necessária</text>
