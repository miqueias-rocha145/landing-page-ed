    :root {
      color-scheme: dark;
      --navy: #031328;
      --navy-soft: #0b2038;
      --blue: #0ea3e8;
      --blue-light: #70cdf5;
      --surface: #0a1b30;
      --surface-raised: #10253c;
      --text: #f4f8fc;
      --muted: #9fb1c4;
      --line: rgba(190, 220, 242, .16);
      --danger: #ff8d8d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      margin: 0;
      background:
        radial-gradient(circle at 4% 3%, rgba(14, 163, 232, .15), transparent 30rem),
        #020b17;
      color: var(--text);
      font-family: "Geist", "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    :focus-visible {
      outline: 3px solid rgba(112, 205, 245, .65);
      outline-offset: 3px;
    }

    .app {
      display: grid;
      min-height: 100vh;
      grid-template-columns: minmax(360px, 460px) minmax(0, 1fr);
    }

    .editor {
      height: 100vh;
      overflow-y: auto;
      padding: 28px;
      border-right: 1px solid var(--line);
      background: rgba(3, 19, 40, .92);
      scrollbar-color: var(--blue) transparent;
    }

    .local-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      padding: 7px 11px;
      border: 1px solid rgba(112, 205, 245, .24);
      border-radius: 999px;
      color: var(--blue-light);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .local-badge::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--blue);
      content: "";
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1,
    h2 {
      font-family: "Plus Jakarta Sans", sans-serif;
    }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(1.8rem, 4vw, 2.45rem);
      line-height: 1.08;
    }

    .intro {
      margin-bottom: 30px;
      color: var(--muted);
      line-height: 1.65;
    }

    .form-section {
      display: grid;
      gap: 15px;
      margin-top: 28px;
      padding-top: 25px;
      border-top: 1px solid var(--line);
    }

    .form-section h2 {
      margin-bottom: 0;
      font-size: 1rem;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field__heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    label {
      color: #dce8f3;
      font-size: .82rem;
      font-weight: 650;
    }

    .counter {
      color: var(--muted);
      font-size: .7rem;
    }

    input {
      width: 100%;
      min-height: 47px;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface-raised);
      color: var(--text);
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(14, 163, 232, .12);
      outline: none;
    }

    input[aria-invalid="true"] {
      border-color: var(--danger);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }

    .actions {
      position: sticky;
      bottom: -28px;
      z-index: 3;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin: 30px -28px -28px;
      padding: 18px 28px 24px;
      border-top: 1px solid var(--line);
      background: rgba(3, 19, 40, .96);
      backdrop-filter: blur(16px);
    }

    .button {
      min-height: 50px;
      padding: 12px 18px;
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 750;
      transition: transform .2s ease, background .2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button--primary {
      background: var(--blue);
      color: #fff;
    }

    .button--secondary {
      border-color: var(--line);
      background: var(--surface-raised);
      color: var(--text);
    }

    .status {
      min-height: 24px;
      margin: 13px 0 0;
      color: var(--blue-light);
      font-size: .8rem;
    }

    .preview-area {
      display: grid;
      min-width: 0;
      place-items: center;
      padding: clamp(24px, 5vw, 70px);
    }

    .preview-shell {
      width: min(100%, 650px);
    }

    .preview-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: .8rem;
    }

    .preview-heading strong {
      color: var(--text);
    }

    #vacancy-art {
      width: 100%;
      height: auto;
      border-radius: 18px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .42);
    }

    @media (max-width: 920px) {
      .app {
        grid-template-columns: 1fr;
      }

      .editor {
        height: auto;
        overflow: visible;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .preview-area {
        order: -1;
        padding-bottom: 18px;
      }

      .preview-shell {
        width: min(100%, 430px);
      }

      .actions {
        bottom: 0;
      }
    }

    @media (max-width: 520px) {
      .editor {
        padding: 20px 16px;
      }

      .form-grid,
      .actions {
        grid-template-columns: 1fr;
      }

      .actions {
        margin-inline: -16px;
        padding-inline: 16px;
      }

      .preview-area {
        padding: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="editor" aria-labelledby="page-title">
      <span class="local-badge">Ferramenta local</span>
      <h1 id="page-title">Gerador de cards de vagas</h1>
      <p class="intro">Preencha os dados, confira a prévia e baixe a arte final em PNG 1080×1350. Esta página não é
        enviada ao site.</p>

      <form id="card-form" novalidate>
        <div class="form-section">
          <h2>Identificação da vaga</h2>
          <div class="field">
            <label for="codigo">Código</label>
            <input id="codigo" name="codigo" value="ED-2026-014" maxlength="11" placeholder="ED-2026-014"
              pattern="ED-[0-9]{4}-[0-9]{3}" required autocomplete="off" />
          </div>
          <div class="field">
            <div class="field__heading">
              <label for="cargo">Cargo</label>
              <span class="counter"><span data-count-for="cargo">0</span>/40</span>
            </div>
            <input id="cargo" name="cargo" maxlength="40" placeholder="Ex.: Cozinheiro(a)" required
              autocomplete="off" />
          </div>
          <div class="form-grid">
            <div class="field">
              <label for="contrato">Contrato</label>
              <input id="contrato" name="contrato" value="Temporário" maxlength="24" required />
            </div>
            <div class="field">
              <label for="jornada">Jornada</label>
              <input id="jornada" name="jornada" value="Escala 6×1" maxlength="24" required />
            </div>
          </div>
        </div>

        <div class="form-section">
          <h2>Principais atividades</h2>
          <div id="activities-fields"></div>
        </div>

        <div class="form-section">
          <h2>Requisitos</h2>
          <div id="requirements-fields"></div>
        </div>

        <p class="status" id="status" role="status" aria-live="polite"></p>
        <div class="actions">
          <button class="button button--primary" type="submit">Baixar PNG</button>
          <button class="button button--secondary" id="clear-button" type="button">Limpar</button>
        </div>
      </form>
    </section>

      const codeInput = document.getElementById('codigo');

      const previewActivities = document.getElementById('preview-activities');
      const previewRequirements = document.getElementById('preview-requirements');

      const createTopicFields = (container, prefix, label) => {
        for (let index = 1; index <= 4; index += 1) {
          const field = document.createElement('div');
          field.className = 'field';
          field.innerHTML = `
            <div class="field__heading">
              <label for="${prefix}-${index}">${label} ${index}</label>
              <span class="counter"><span data-count-for="${prefix}-${index}">0</span>/55</span>

        }
      };

      createTopicFields(activityContainer, 'atividade', 'Atividade');
      createTopicFields(requirementContainer, 'requisito', 'Requisito');

      const value = (id) => document.getElementById(id).value.trim();
      const topicValues = (prefix) => Array.from({ length: 4 }, (_, index) => value(`${prefix}-${index + 1}`));

      const splitCargo = (cargo) => {
        if (!cargo) return { line1: 'CARGO DA VAGA', line2: '', y: 365, size: 72 };
        if (cargo.length <= 20) return { line1: cargo, line2: '', y: 365, size: cargo.length >= 19 ? 68 : 72 };

        const words = cargo.split(/\s+/);
        let bestIndex = 1;
        let bestDifference = Number.POSITIVE_INFINITY;
        for (let index = 1; index < words.length; index += 1) {
          const first = words.slice(0, index).join(' ');
          const second = words.slice(index).join(' ');
          const difference = Math.abs(first.length - second.length);
          if (difference < bestDifference) {
            bestDifference = difference;
            bestIndex = index;
          }
        }

        const line1 = words.slice(0, bestIndex).join(' ');
        const line2 = words.slice(bestIndex).join(' ');
        const longest = Math.max(line1.length, line2.length);
        return { line1, line2, y: 325, size: longest > 20 ? 62 : 68 };
      };

      const renderTopics = (container, topics, positions) => {
        container.replaceChildren();
        topics.forEach((topic, index) => {
          if (!topic) return;
          const circle = document.createElementNS(namespace, 'circle');
          circle.setAttribute('cx', '83');
          circle.setAttribute('cy', String(positions[index]));
          circle.setAttribute('r', '6');
          circle.setAttribute('fill', '#0EA3E8');

          const text = document.createElementNS(namespace, 'text');
          text.setAttribute('x', '110');
          text.setAttribute('y', String(positions[index] + 10));
          text.textContent = topic;
          container.append(circle, text);
        });
      };

      const updatePreview = () => {
        const code = codeInput.value.trim().toUpperCase();
        if (codeInput.value !== code) codeInput.value = code;
        document.getElementById('preview-code').textContent = code || 'ED-AAAA-000';
        document.getElementById('preview-contract').textContent = contractInput.value.trim() || 'Contrato';
        document.getElementById('preview-schedule').textContent = scheduleInput.value.trim() || 'Jornada';

        const cargo = splitCargo(cargoInput.value.trim().toUpperCase());
        const cargoText = document.getElementById('preview-cargo');
        cargoText.setAttribute('y', String(cargo.y));
        cargoText.setAttribute('font-size', String(cargo.size));
        document.getElementById('preview-cargo-1').textContent = cargo.line1;
        document.getElementById('preview-cargo-2').textContent = cargo.line2;

        renderTopics(previewActivities, topicValues('atividade'), [620, 665, 710, 755]);
        renderTopics(previewRequirements, topicValues('requisito'), [910, 955, 1000, 1045]);

        document.querySelectorAll('[data-count-for]').forEach((counter) => {
          counter.textContent = String(value(counter.dataset.countFor).length);
        });

        document.getElementById('art-title').textContent = `Vaga ${code || 'sem código'} — ${cargoInput.value.trim() || 'sem cargo'}`;
      };

      const validate = () => {
        const codePattern = /^ED-\d{4}-\d{3}$/;
        const fields = [codeInput, cargoInput, contractInput, scheduleInput];
        fields.forEach((field) => field.removeAttribute('aria-invalid'));

        if (!codePattern.test(codeInput.value.trim())) {
          codeInput.setAttribute('aria-invalid', 'true');
          codeInput.focus();
          status.textContent = 'Use o código no formato ED-AAAA-000.';
          return false;
        }

        const emptyRequired = fields.slice(1).find((field) => !field.value.trim());
        if (emptyRequired) {
          emptyRequired.setAttribute('aria-invalid', 'true');
          emptyRequired.focus();
          status.textContent = 'Preencha código, cargo, contrato e jornada.';
          return false;
        }

        if (!topicValues('atividade').some(Boolean) || !topicValues('requisito').some(Boolean)) {
          status.textContent = 'Informe pelo menos uma atividade e um requisito.';
          return false;
        }

        return true;
      };

      const downloadPng = async () => {
        if (!validate()) return;
        status.textContent = 'Gerando a arte em alta resolução...';
        await document.fonts.ready;

        const clone = svg.cloneNode(true);
        clone.setAttribute('width', '1080');
        clone.setAttribute('height', '1350');
        const source = new XMLSerializer().serializeToString(clone);
        const sourceBlob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
        const sourceUrl = URL.createObjectURL(sourceBlob);

        try {
          const image = new Image();
          image.src = sourceUrl;
          await image.decode();

          const canvas = document.createElement('canvas');
          canvas.width = 1080;
          canvas.height = 1350;
          const context = canvas.getContext('2d');
          context.drawImage(image, 0, 0, 1080, 1350);

          const png = await new Promise((resolve, reject) => {
            canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('Falha ao criar o PNG.')), 'image/png');
          });
          const downloadUrl = URL.createObjectURL(png);
          const link = document.createElement('a');
          link.href = downloadUrl;
          link.download = `${codeInput.value.trim()}-feed.png`;
          link.click();
          setTimeout(() => URL.revokeObjectURL(downloadUrl), 1500);
          status.textContent = `Arte ${link.download} gerada com sucesso.`;
        } catch (error) {
          console.error(error);
          status.textContent = 'Não foi possível gerar a imagem. Reabra esta página em Chrome ou Edge e tente novamente.';
        } finally {
          URL.revokeObjectURL(sourceUrl);
        }
      };

      form.addEventListener('input', updatePreview);
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        downloadPng();
      });

      document.getElementById('clear-button').addEventListener('click', () => {
        form.reset();
        codeInput.value = 'ED-2026-014';
        contractInput.value = 'Temporário';
        scheduleInput.value = 'Escala 6×1';
        status.textContent = 'Campos limpos.';
        cargoInput.focus();
        updatePreview();
      });

      updatePreview();
    })();
  </script>
</body>

</html>
